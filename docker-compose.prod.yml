# Production-shaped full stack. Default demo secrets are for local rehearsal only.
# Real production must set DB_PASSWORD, S3_*, KC_*, HTTPS OIDC issuer, and
# SPRING_PROFILES_ACTIVE=prod (ProductionSafetyGuard then requires HTTPS + non-demo secrets).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Prefer kubernetes manifests under deploy/kubernetes for actual production.

name: vox-itsm-prod

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itsm}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4-management-alpine@sha256:002a875e96365eeed67be445becfd240947ca82279103b592a859ea7a8e2a746
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-itsm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-itsm}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  opensearch:
    restart: unless-stopped
    image: opensearchproject/opensearch:2.19.1@sha256:72fe2fc84be8295906b8efca020b46c58ed45c8da60cd9b8b49e1991e38e89a4
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: [opensearch_data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for i in $$(seq 1 30); do
          if mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; then
            break
          fi
          echo "minio not reachable yet (attempt $$i)"
          sleep 2
        done
        mc mb --ignore-existing local/itsm-attachments
        echo 'MinIO bucket itsm-attachments ready'
    restart: "no"

  keycloak-db:
    restart: unless-stopped
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes: [keycloak_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.2@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    # Production mode: realm state lives in PostgreSQL, not in the throwaway dev store.
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${ITSM_KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports: ["${ITSM_KEYCLOAK_PORT:-8081}:8080"]
    volumes: [./infra/keycloak:/opt/keycloak/data/import]
    depends_on:
      keycloak-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-compose}
      DATABASE_URL: jdbc:postgresql://postgres:5432/itsm
      DATABASE_USER: itsm
      DATABASE_PASSWORD: ${DB_PASSWORD:-itsm}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-itsm}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-itsm}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: itsm
      ITSM_STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: itsm-attachments
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PATH_STYLE: "true"
      ITSM_REDIS_ENABLED: "true"
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8081/realms/itsm}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/itsm/protocol/openid-connect/certs
      ITSM_CORS_ORIGINS: ${ITSM_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    ports: ["${ITSM_BACKEND_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      clamav: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 50s
      retries: 8

  clamav:
    restart: unless-stopped
    image: clamav/clamav:1.4.6@sha256:c3bfbf2a2c9abc1fc179e63832a9e8bfac901ede83853e3fa10acf6f1fb5c803
    environment:
      CLAMD_STARTUP_TIMEOUT: "180"
    volumes: [clamav_data:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
        VITE_USE_MOCK: "false"
        VITE_OIDC_ENABLED: "true"
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-http://localhost:8081/realms/itsm}
        VITE_OIDC_CLIENT_ID: itsm-spa
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
    ports: ["${ITSM_FRONTEND_PORT:-80}:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
  keycloak_db_data:
  rabbitmq_data:
  redis_data:
  opensearch_data:
  minio_data:
  clamav_data:
