apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vox-itsm
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: vox-itsm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: vox-itsm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: vox-itsm
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kubernetes has no dependency ordering: without this the pod crashloops through
        # Flyway until the database accepts connections, which looks like an app fault.
        - name: wait-for-database
          image: vox-itsm-backend:0.2.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              host=$(printf '%s' "$DATABASE_URL" | sed -e 's|.*//||' -e 's|[:/].*||')
              port=$(printf '%s' "$DATABASE_URL" | sed -e 's|.*//[^:]*:||' -e 's|/.*||')
              until nc -z "$host" "${port:-5432}"; do
                echo "waiting for $host:${port:-5432}"
                sleep 2
              done
          envFrom:
            - secretRef:
                name: itsm-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: backend
          image: vox-itsm-backend:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: itsm-config
            - secretRef:
                name: itsm-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # Endpoint removal is asynchronous: keep serving while the change propagates,
              # otherwise a rolling update drops requests already routed to this pod.
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: vox-itsm
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: vox-itsm
  ports:
    - name: http
      port: 8080
      targetPort: http
