apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsm
  namespace: vox-itsm
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [itsm.example.com]
      secretName: itsm-tls
  rules:
    - host: itsm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
