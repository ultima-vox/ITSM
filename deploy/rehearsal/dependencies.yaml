# Ephemeral dependencies for the rehearsal overlay only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vox-itsm
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: vox-itsm }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: vox-itsm }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: itsm }
            - { name: POSTGRES_USER, value: itsm }
            - { name: POSTGRES_PASSWORD, value: rehearsal-database-password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "itsm", "-d", "itsm"] }
            periodSeconds: 5
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: vox-itsm }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: vox-itsm
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: vox-itsm }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: vox-itsm }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: itsm }
            - { name: RABBITMQ_DEFAULT_PASS, value: rehearsal-broker-password }
          ports: [{ name: amqp, containerPort: 5672 }]
          readinessProbe:
            exec: { command: ["su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: vox-itsm }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports: [{ name: amqp, port: 5672, targetPort: amqp }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: vox-itsm
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: vox-itsm }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: vox-itsm }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: rehearsal-admin-password }
            - { name: KC_HOSTNAME, value: "https://id.itsm.test:9443" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          readinessProbe:
            httpGet: { path: /realms/itsm/.well-known/openid-configuration, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: realm
          configMap: { name: itsm-realm }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: vox-itsm }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
