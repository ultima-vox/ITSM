# Rehearsal credentials. Real deployments supply deploy/kubernetes/secret.example.yaml
# filled from their own secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: itsm-secrets
  namespace: vox-itsm
type: Opaque
stringData:
  DATABASE_URL: jdbc:postgresql://postgres.vox-itsm.svc.cluster.local:5432/itsm
  DATABASE_USER: itsm
  DATABASE_PASSWORD: rehearsal-database-password
  RABBITMQ_USER: itsm
  RABBITMQ_PASSWORD: rehearsal-broker-password
  OIDC_ISSUER_URI: https://id.itsm.test:9443/realms/itsm
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak.vox-itsm.svc.cluster.local:8080/realms/itsm/protocol/openid-connect/certs
