server:
  # Finish in-flight requests instead of cutting them when the platform sends SIGTERM.
  shutdown: graceful

spring:
  application:
    name: vox-itsm
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DATABASE_USER:itsm}
    password: ${DATABASE_PASSWORD:itsm}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/itsm}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # Redis is optional; CacheConfiguration creates the client only when itsm.redis.enabled=true.
  # Exclude Boot auto-config so disabled environments never open a Redis connection.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
    propagation:
      produce: W3C
      consume: W3C,B3,B3_MULTI
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
      connect-timeout: ${OTEL_EXPORTER_OTLP_CONNECT_TIMEOUT:3s}
      timeout: ${OTEL_EXPORTER_OTLP_TIMEOUT:10s}
  metrics:
    distribution:
      # The latency alert and dashboard read http_server_requests_seconds_bucket; without
      # this Micrometer publishes only count/sum/max and the p95 panel and alert are dead.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    # Custom redisCache / opensearch indicators register only when integrations are on.
    defaults:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
itsm:
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT5S}
    # Publish failures back off exponentially; rows exhausting the budget are quarantined.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    backoff-base: ${OUTBOX_BACKOFF_BASE:PT5S}
    backoff-max: ${OUTBOX_BACKOFF_MAX:PT5M}
  search:
    # Periodic search projection reconciliation (safety net after index downtime/drift).
    reindex-interval: ${ITSM_SEARCH_REINDEX_INTERVAL:PT10M}
    reindex-initial-delay: ${ITSM_SEARCH_REINDEX_INITIAL_DELAY:PT2M}
  sla:
    # How often the SLA breach/warning sweep runs, and its startup delay.
    breach-interval: ${ITSM_SLA_BREACH_INTERVAL:PT1M}
    breach-initial-delay: ${ITSM_SLA_BREACH_INITIAL_DELAY:PT1M}
  automation:
    # Failed actions retry with exponential backoff; rows exhausting the budget are quarantined.
    max-attempts: ${AUTOMATION_MAX_ATTEMPTS:5}
    backoff-base: ${AUTOMATION_BACKOFF_BASE:PT30S}
    backoff-max: ${AUTOMATION_BACKOFF_MAX:PT10M}
    retry-interval: ${AUTOMATION_RETRY_INTERVAL:PT1M}
    retry-initial-delay: ${AUTOMATION_RETRY_INITIAL_DELAY:PT1M}
  workflow:
    timers:
      poll-interval: ${WORKFLOW_TIMER_POLL_INTERVAL:PT5S}
  cors:
    # Vite default dev server; override for additional frontends.
    allowed-origins: ${ITSM_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # --- Optional integrations (safe defaults: no live Redis/OpenSearch/MinIO required) ---
  redis:
    enabled: ${ITSM_REDIS_ENABLED:false}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    key-prefix: ${ITSM_REDIS_KEY_PREFIX:itsm:cache:}
    timeout: ${ITSM_REDIS_TIMEOUT:PT2S}
  opensearch:
    # When set (e.g. http://localhost:9200), SearchIndexService uses OpenSearch HTTP; else JDBC.
    url: ${OPENSEARCH_URL:}
    index: ${OPENSEARCH_INDEX:itsm}
    # Required once the cluster runs with its security plugin enabled.
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    # PEM authority for an https cluster endpoint signed by a private CA.
    ca-certificate: ${OPENSEARCH_CA_CERTIFICATE:}
    connect-timeout: ${OPENSEARCH_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${OPENSEARCH_READ_TIMEOUT:PT5S}
  notifications:
    # Purge rows older than N days (0 = retention job no-op)
    retention-days: ${ITSM_NOTIFICATION_RETENTION_DAYS:90}
    retention-cron: ${ITSM_NOTIFICATION_RETENTION_CRON:0 30 3 * * *}
    webhook:
      # Set ITSM_NOTIFICATION_WEBHOOK_URL to enable EMAIL/WEBHOOK HTTP fan-out.
      # Do not set an empty url key — bean is conditional on property presence.
      timeout: ${ITSM_NOTIFICATION_WEBHOOK_TIMEOUT:PT3S}
  security:
    # Must stay false outside profile dev; ProductionSafetyGuard enforces
    permit-unauthenticated: ${ITSM_PERMIT_UNAUTHENTICATED:false}
  ai:
    # AI copilot provider. Set itsm.ai.ollama.url to an OpenAI-compatible endpoint
    # (e.g. http://localhost:11434/v1 for Ollama) to enable a real model provider.
    # When unset, a deterministic advisory logging gateway remains active.
    ollama:
      url: ${ITSM_AI_OLLAMA_URL:}
      model: ${ITSM_AI_OLLAMA_MODEL:}
      connect-timeout: ${ITSM_AI_OLLAMA_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${ITSM_AI_OLLAMA_READ_TIMEOUT:PT120S}
  storage:
    # local = metadata-only NoOp for dev; s3 = MinIO/AWS S3-compatible
    type: ${ITSM_STORAGE_TYPE:local}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      bucket: ${S3_BUCKET:itsm-attachments}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      region: ${S3_REGION:us-east-1}
      path-style-access: ${S3_PATH_STYLE:true}
    clamav:
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout: ${CLAMAV_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${CLAMAV_READ_TIMEOUT:PT30S}
    scan-retry-interval: ${ITSM_STORAGE_SCAN_RETRY_INTERVAL:PT1M}
    scan-retry-initial-delay: ${ITSM_STORAGE_SCAN_RETRY_INITIAL_DELAY:PT30S}
