name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build + e2e
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_TOKEN: VOX_CI_SECRET_MUST_NOT_SHIP

      - name: Verify dev token excluded from production bundle
        run: |
          if grep -R "VOX_CI_SECRET_MUST_NOT_SHIP" dist; then
            echo "Production bundle contains VITE_API_TOKEN"
            exit 1
          fi

      - name: Verify generated API contract
        run: npm run api:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (mock mode)
        run: npm run test:e2e
        env:
          CI: true
          VITE_USE_MOCK: true

      - name: Cleanup frontend artifacts
        if: always()
        run: |
          rm -rf frontend/dist frontend/node_modules/.cache
          npx playwright install --dry-run 2>/dev/null || true
          rm -rf ~/.cache/ms-playwright

  backend:
    name: Backend tests
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run backend tests
        run: ./gradlew test --no-daemon

      - name: Cleanup backend artifacts
        if: always()
        run: |
          ./gradlew clean --no-daemon 2>/dev/null || true
          rm -rf backend/build backend/.gradle

  live-e2e:
    name: Live PostgreSQL full-stack E2E
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: itsm
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm-ci
        ports:
          - 35432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/wrapper-validation@v4

      - name: Start migrated backend
        run: |
          SPRING_PROFILES_ACTIVE=dev \
          SERVER_PORT=18080 \
          DATABASE_URL=jdbc:postgresql://127.0.0.1:35432/itsm \
          DATABASE_PASSWORD=itsm-ci \
          ./backend/gradlew -p backend bootRun --no-daemon --args='--server.port=18080' > /tmp/itsm-backend.log 2>&1 &
          echo $! > /tmp/itsm-backend.pid
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/actuator/health && exit 0
            sleep 2
          done
          tail -100 /tmp/itsm-backend.log
          exit 1

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check OpenAPI snapshot drift
        run: |
          curl -sf http://127.0.0.1:18080/v3/api-docs | jq -S . > /tmp/openapi-live.json
          jq -S . frontend/openapi/itsm.json > /tmp/openapi-snapshot.json
          diff -u /tmp/openapi-snapshot.json /tmp/openapi-live.json

      - name: Run live contract E2E
        working-directory: frontend
        env:
          CI: true
          VITE_USE_MOCK: 'false'
          VITE_API_PROXY_TARGET: http://127.0.0.1:18080
        run: npx playwright test e2e/live.spec.ts

      - name: Set up k6
        if: github.event_name == 'workflow_dispatch'
        uses: grafana/setup-k6-action@v1

      - name: Run load baseline
        if: github.event_name == 'workflow_dispatch'
        uses: grafana/run-k6-action@v1
        with:
          path: scripts/load-smoke.js
        env:
          BASE_URL: http://127.0.0.1:18080
          OIDC_TOKEN_URL: http://127.0.0.1:8081/realms/itsm/protocol/openid-connect/token
          READ_VUS: '10'
          WRITE_VUS: '4'
          ITERATIONS: '40'
          MAX_DURATION: 2m
          SUMMARY_PATH: /tmp/itsm-performance-summary.json

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-backend-log
          path: /tmp/itsm-backend.log

      - name: Cleanup live-e2e artifacts
        if: always()
        run: |
          # Stop backend process
          if [ -f /tmp/itsm-backend.pid ]; then
            kill "$(cat /tmp/itsm-backend.pid)" 2>/dev/null || true
            rm -f /tmp/itsm-backend.pid
          fi
          rm -f /tmp/itsm-backend.log /tmp/openapi-live.json /tmp/openapi-snapshot.json
          rm -rf backend/build backend/.gradle frontend/dist frontend/node_modules/.cache
          rm -rf ~/.cache/ms-playwright

  scripts:
    name: Scripts lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          bash -n scripts/smoke-api.sh
          bash -n scripts/smoke-integrations.sh
          bash -n scripts/smoke-compose.sh
          bash -n scripts/smoke-setup.sh
          bash -n scripts/verify-compose-runtime.sh
          bash -n scripts/verify-observability.sh
          bash -n scripts/gen-tls-cert.sh
          bash -n scripts/gen-opensearch-certs.sh
          bash -n scripts/gen-opensearch-users.sh
          test -f scripts/smoke-api.ps1
          test -f scripts/smoke-integrations.ps1
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate Keycloak organization claims
        run: |
          jq -e '
            ([.users[].attributes.organization_id[0]] | all(. == "default")) and
            ([.clients[].defaultClientScopes] | all(index("organization"))) and
            ([.clientScopes[].name] | index("organization") != null)
          ' infra/keycloak/itsm-realm.json >/dev/null
      - name: Validate access tokens carry a subject claim
        run: |
          jq -e '
            ([.clients[].defaultClientScopes] | all(index("basic"))) and
            ([.clientScopes[] | select(.name == "basic") | .protocolMappers[].protocolMapper]
              | index("oidc-sub-mapper") != null) and
            ([.users[].id] | all(. != null))
          ' infra/keycloak/itsm-realm.json >/dev/null

  kubernetes:
    name: Kubernetes manifests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize base
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            registry.k8s.io/kubectl:v1.33.0 \
            kustomize deploy/kubernetes > /tmp/itsm-kubernetes.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm \
            -v /tmp/itsm-kubernetes.yaml:/manifest.yaml:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary /manifest.yaml
      - name: Validate observability assets
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability:/observability:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /observability/prometheus-rules.yml
          jq -e '.uid and (.panels | length > 0)' \
            deploy/observability/grafana-dashboard.json >/dev/null
      - name: Cleanup Kubernetes test artifacts
        if: always()
        run: |
          rm -f /tmp/itsm-kubernetes.yaml
          docker image prune -f 2>/dev/null || true

  security:
    name: Security + SBOM
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Filesystem vulnerability, secret, and misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # Build output and agent scratch directories are not shipped, and walking them is
          # what pushes this scan past the default timeout.
          skip-dirs: node_modules,.git,backend/build,backend/.gradle,frontend/dist,.codex,.cursor,.grok,.opencode,.vault,.tools
          timeout: 20m

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      - name: Cleanup SBOM artifacts
        if: always()
        run: rm -f sbom.spdx.json

  sast:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - javascript-typescript
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  container-security:
    name: Container image scan
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vox-itsm-backend:ci
            context: backend
          - image: vox-itsm-frontend:ci
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ matrix.image }}

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Cleanup container image
        if: always()
        run: docker rmi ${{ matrix.image }} 2>/dev/null || true

  compose-smoke:
    name: Compose full-stack smoke
    runs-on: [self-hosted, linux]
    env:
      COMPOSE_PROJECT_NAME: itsm-ci-${{ github.run_id }}
      ITSM_POSTGRES_PORT: "25432"
      ITSM_REDIS_PORT: "26379"
      ITSM_RABBITMQ_PORT: "25672"
      ITSM_RABBITMQ_UI_PORT: "35672"
      ITSM_OPENSEARCH_PORT: "29200"
      ITSM_MINIO_PORT: "29000"
      ITSM_MINIO_UI_PORT: "29001"
      ITSM_KEYCLOAK_PORT: "28081"
      ITSM_BACKEND_PORT: "28080"
      ITSM_FRONTEND_PORT: "28000"
      ITSM_KEYCLOAK_PUBLIC_URL: http://localhost:28081
      OIDC_ISSUER_URI: http://localhost:28081/realms/itsm
      VITE_OIDC_ISSUER: http://localhost:28081/realms/itsm
      VITE_OIDC_REDIRECT_URI: http://localhost:28000/auth/callback
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker info
          docker compose version

      - name: Build and start complete stack
        run: docker compose up -d --build

      - name: Wait for healthy services
        run: |
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:28080/actuator/health >/dev/null \
              && curl -sf http://127.0.0.1:28000/healthz >/dev/null \
              && curl -sf http://127.0.0.1:28081/realms/itsm/.well-known/openid-configuration >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for stack"
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Live Compose smoke
        run: |
          FRONTEND_URL=http://127.0.0.1:28000 \
          BACKEND_URL=http://127.0.0.1:28080 \
          KEYCLOAK_URL=http://127.0.0.1:28081 \
          bash scripts/smoke-compose.sh

      - name: Verify clean Flyway install and restart persistence
        env:
          BACKEND_URL: http://127.0.0.1:28080
          KEYCLOAK_URL: http://127.0.0.1:28081
        run: bash scripts/verify-compose-runtime.sh

      - name: Verify the alerting contract
        env:
          BACKEND_URL: http://127.0.0.1:28080
          KEYCLOAK_URL: http://127.0.0.1:28081
        run: bash scripts/verify-observability.sh

      - name: Set up Node.js for deployed-stack E2E
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Keycloak login E2E against the running stack
        working-directory: frontend
        env:
          CI: true
          ITSM_E2E_BASE_URL: http://127.0.0.1:28000
        run: npx playwright test e2e/oidc-login.spec.ts

      - name: Capture Compose evidence
        if: always()
        run: |
          mkdir -p /tmp/itsm-compose-ci
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "ref=${GITHUB_REF}"
            echo "runner=${RUNNER_NAME}"
          } > /tmp/itsm-compose-ci/meta.txt
          docker compose ps > /tmp/itsm-compose-ci/ps.txt || true
          docker compose exec -T postgres psql -U itsm -d itsm -c \
            "select installed_rank, version, description, success from flyway_schema_history order by installed_rank;" \
            > /tmp/itsm-compose-ci/flyway.txt || true
          if [ "${{ job.status }}" != "success" ]; then
            docker compose logs --no-color --tail=400 > /tmp/itsm-compose-ci/logs.txt || true
          fi

      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-${{ github.run_id }}
          path: /tmp/itsm-compose-ci
          if-no-files-found: ignore

      - name: Teardown this Compose project
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -rf /tmp/itsm-compose-ci
          rm -rf frontend/node_modules/.cache frontend/test-results frontend/playwright-report
          rm -rf ~/.cache/ms-playwright

  # Self-hosted runner maintenance — runs after every CI trigger
  runner-cleanup:
    name: Runner disk cleanup
    if: always()
    runs-on: [self-hosted, linux]
    needs:
      - frontend
      - backend
      - live-e2e
      - scripts
      - kubernetes
      - security
      - sast
      - dependency-review
      - container-security
      - compose-smoke
    steps:
      - name: Remove this-run leftovers only
        run: |
          rm -rf /tmp/itsm-*
          docker image prune -f
          docker builder prune -f

      - name: Report disk usage
        run: |
          echo "=== Disk usage after cleanup ==="
          df -h /
          echo "=== Docker disk usage ==="
          docker system df 2>/dev/null || true
