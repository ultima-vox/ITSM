name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build + e2e
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_TOKEN: VOX_CI_SECRET_MUST_NOT_SHIP

      - name: Verify dev token excluded from production bundle
        run: |
          if grep -R "VOX_CI_SECRET_MUST_NOT_SHIP" dist; then
            echo "Production bundle contains VITE_API_TOKEN"
            exit 1
          fi

      - name: Verify generated API contract
        run: npm run api:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (mock mode)
        run: npm run test:e2e
        env:
          CI: true
          VITE_USE_MOCK: true

      - name: Cleanup frontend artifacts
        if: always()
        run: |
          rm -rf frontend/dist frontend/node_modules/.cache
          npx playwright install --dry-run 2>/dev/null || true
          rm -rf ~/.cache/ms-playwright

  backend:
    name: Backend tests
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run backend tests
        run: ./gradlew test --no-daemon

      - name: Cleanup backend artifacts
        if: always()
        run: |
          ./gradlew clean --no-daemon 2>/dev/null || true
          rm -rf backend/build backend/.gradle

  live-e2e:
    name: Live PostgreSQL full-stack E2E
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: itsm
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/wrapper-validation@v4

      - name: Start migrated backend
        run: |
          SPRING_PROFILES_ACTIVE=dev \
          DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/itsm \
          DATABASE_PASSWORD=itsm-ci \
          ./backend/gradlew -p backend bootRun --no-daemon > /tmp/itsm-backend.log 2>&1 &
          echo $! > /tmp/itsm-backend.pid
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/actuator/health && exit 0
            sleep 2
          done
          tail -100 /tmp/itsm-backend.log
          exit 1

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check OpenAPI snapshot drift
        run: |
          curl -sf http://127.0.0.1:8080/v3/api-docs | jq -S . > /tmp/openapi-live.json
          jq -S . frontend/openapi/itsm.json > /tmp/openapi-snapshot.json
          diff -u /tmp/openapi-snapshot.json /tmp/openapi-live.json

      - name: Run live contract E2E
        working-directory: frontend
        env:
          CI: true
          VITE_USE_MOCK: 'false'
          VITE_API_PROXY_TARGET: http://127.0.0.1:8080
        run: npx playwright test e2e/live.spec.ts

      - name: Set up k6
        if: github.event_name == 'workflow_dispatch'
        uses: grafana/setup-k6-action@v1

      - name: Run load baseline
        if: github.event_name == 'workflow_dispatch'
        uses: grafana/run-k6-action@v1
        with:
          path: scripts/load-smoke.js
        env:
          BASE_URL: http://127.0.0.1:8080
          VUS: '10'
          DURATION: 30s

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-backend-log
          path: /tmp/itsm-backend.log

      - name: Cleanup live-e2e artifacts
        if: always()
        run: |
          # Stop backend process
          if [ -f /tmp/itsm-backend.pid ]; then
            kill "$(cat /tmp/itsm-backend.pid)" 2>/dev/null || true
            rm -f /tmp/itsm-backend.pid
          fi
          rm -f /tmp/itsm-backend.log /tmp/openapi-live.json /tmp/openapi-snapshot.json
          rm -rf backend/build backend/.gradle frontend/dist frontend/node_modules/.cache
          rm -rf ~/.cache/ms-playwright

  scripts:
    name: Scripts lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          bash -n scripts/smoke-api.sh
          bash -n scripts/smoke-integrations.sh
          test -f scripts/smoke-api.ps1
          test -f scripts/smoke-integrations.ps1
      - name: Validate Keycloak organization claims
        run: |
          jq -e '
            ([.users[].attributes.organization_id[0]] | all(. == "default")) and
            ([.clients[].defaultClientScopes] | all(index("organization"))) and
            ([.clientScopes[].name] | index("organization") != null)
          ' infra/keycloak/itsm-realm.json >/dev/null

  kubernetes:
    name: Kubernetes manifests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize base
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            registry.k8s.io/kubectl:v1.33.0 \
            kustomize deploy/kubernetes > /tmp/itsm-kubernetes.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm \
            -v /tmp/itsm-kubernetes.yaml:/manifest.yaml:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary /manifest.yaml
      - name: Validate observability assets
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability:/observability:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /observability/prometheus-rules.yml
          jq -e '.uid and (.panels | length > 0)' \
            deploy/observability/grafana-dashboard.json >/dev/null
      - name: Cleanup Kubernetes test artifacts
        if: always()
        run: |
          rm -f /tmp/itsm-kubernetes.yaml
          docker image prune -f 2>/dev/null || true

  security:
    name: Security + SBOM
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Filesystem vulnerability, secret, and misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      - name: Cleanup SBOM artifacts
        if: always()
        run: rm -f sbom.spdx.json

  sast:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin
          - javascript-typescript
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  container-security:
    name: Container image scan
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vox-itsm-backend:ci
            context: backend
          - image: vox-itsm-frontend:ci
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ matrix.image }}

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Cleanup container image
        if: always()
        run: docker rmi ${{ matrix.image }} 2>/dev/null || true

  # Optional full stack — manual only (slow / resource heavy)
  compose-smoke:
    name: Compose integrations smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: docker compose up -d postgres redis opensearch minio minio-init rabbitmq
      - name: Wait for health
        run: |
          for _ in $(seq 1 40); do
            docker compose ps
            curl -sf http://127.0.0.1:9200/_cluster/health && redis-cli -h 127.0.0.1 ping | grep -q PONG && break
            sleep 5
          done
          curl -sf http://127.0.0.1:9200/_cluster/health
          redis-cli -h 127.0.0.1 ping
      - name: Integration smoke script
        run: bash scripts/smoke-integrations.sh
        env:
          OPENSEARCH_URL: http://127.0.0.1:9200
          REDIS_HOST: 127.0.0.1
          MINIO_URL: http://127.0.0.1:9000/minio/health/live
          BASE_URL: http://127.0.0.1:8080
      - name: Teardown compose stack
        if: always()
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

  # Self-hosted runner maintenance — runs after every CI trigger
  runner-cleanup:
    name: Runner disk cleanup
    if: always()
    runs-on: [self-hosted, linux]
    needs:
      - frontend
      - backend
      - live-e2e
      - scripts
      - kubernetes
      - security
      - sast
      - dependency-review
      - container-security
      - compose-smoke
    steps:
      - name: Stop lingering Java processes
        run: |
          pkill -f 'gradlew' 2>/dev/null || true
          pkill -f 'GradleDaemon' 2>/dev/null || true
          pkill -f 'bootRun' 2>/dev/null || true

      - name: Stop lingering Node processes
        run: |
          pkill -f 'vite' 2>/dev/null || true
          pkill -f 'playwright' 2>/dev/null || true

      - name: Prune Docker system
        run: |
          docker system prune -af --volumes 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true

      - name: Clean build caches
        run: |
          rm -rf /tmp/itsm-*
          rm -rf ~/.gradle/caches/build-cache-* 2>/dev/null || true
          rm -rf ~/.npm/_cacache 2>/dev/null || true
          rm -rf ~/.cache/ms-playwright 2>/dev/null || true

      - name: Report disk usage
        run: |
          echo "=== Disk usage after cleanup ==="
          df -h /
          echo "=== Docker disk usage ==="
          docker system df 2>/dev/null || true
