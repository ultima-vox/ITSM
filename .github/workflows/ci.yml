name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (mock mode)
        run: npm run test:e2e
        env:
          CI: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run backend tests
        run: ./gradlew test --no-daemon

  scripts:
    name: Scripts lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          bash -n scripts/smoke-api.sh
          bash -n scripts/smoke-integrations.sh
          test -f scripts/smoke-api.ps1
          test -f scripts/smoke-integrations.ps1

  security:
    name: Security + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Filesystem vulnerability, secret, and misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  # Optional full stack — manual only (slow / resource heavy)
  compose-smoke:
    name: Compose integrations smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: docker compose up -d postgres redis opensearch minio minio-init rabbitmq
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            docker compose ps
            curl -sf http://127.0.0.1:9200/_cluster/health && redis-cli -h 127.0.0.1 ping | grep -q PONG && break
            sleep 5
          done
          curl -sf http://127.0.0.1:9200/_cluster/health
          redis-cli -h 127.0.0.1 ping
      - name: Integration smoke script
        run: bash scripts/smoke-integrations.sh
        env:
          OPENSEARCH_URL: http://127.0.0.1:9200
          REDIS_HOST: 127.0.0.1
          MINIO_URL: http://127.0.0.1:9000/minio/health/live
          BASE_URL: http://127.0.0.1:8080
