name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (mock mode)
        run: npm run test:e2e
        env:
          CI: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run backend tests
        run: ./gradlew test --no-daemon

  live-e2e:
    name: Live PostgreSQL full-stack E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: itsm
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/wrapper-validation@v4

      - name: Start migrated backend
        run: |
          SPRING_PROFILES_ACTIVE=dev \
          DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/itsm \
          DATABASE_PASSWORD=itsm-ci \
          ./backend/gradlew -p backend bootRun --no-daemon > /tmp/itsm-backend.log 2>&1 &
          echo $! > /tmp/itsm-backend.pid
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/actuator/health && exit 0
            sleep 2
          done
          tail -100 /tmp/itsm-backend.log
          exit 1

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run live contract E2E
        working-directory: frontend
        env:
          CI: true
          VITE_USE_MOCK: 'false'
          VITE_API_PROXY_TARGET: http://127.0.0.1:8080
        run: npx playwright test e2e/live.spec.ts

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-backend-log
          path: /tmp/itsm-backend.log

  scripts:
    name: Scripts lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          bash -n scripts/smoke-api.sh
          bash -n scripts/smoke-integrations.sh
          test -f scripts/smoke-api.ps1
          test -f scripts/smoke-integrations.ps1

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize base
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            registry.k8s.io/kubectl:v1.33.0 \
            kustomize deploy/kubernetes > /tmp/itsm-kubernetes.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm \
            -v /tmp/itsm-kubernetes.yaml:/manifest.yaml:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary /manifest.yaml

  security:
    name: Security + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Filesystem vulnerability, secret, and misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  container-security:
    name: Container image scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vox-itsm-backend:ci
            context: backend
          - image: vox-itsm-frontend:ci
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ matrix.image }}

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Optional full stack — manual only (slow / resource heavy)
  compose-smoke:
    name: Compose integrations smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: docker compose up -d postgres redis opensearch minio minio-init rabbitmq
      - name: Wait for health
        run: |
          for _ in $(seq 1 40); do
            docker compose ps
            curl -sf http://127.0.0.1:9200/_cluster/health && redis-cli -h 127.0.0.1 ping | grep -q PONG && break
            sleep 5
          done
          curl -sf http://127.0.0.1:9200/_cluster/health
          redis-cli -h 127.0.0.1 ping
      - name: Integration smoke script
        run: bash scripts/smoke-integrations.sh
        env:
          OPENSEARCH_URL: http://127.0.0.1:9200
          REDIS_HOST: 127.0.0.1
          MINIO_URL: http://127.0.0.1:9000/minio/health/live
          BASE_URL: http://127.0.0.1:8080
